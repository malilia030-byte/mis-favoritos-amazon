<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Mis Favoritos de Amazon · Buscar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF6EF; --bg2:#F5EDE2; --card:#fff;
  --cream:#FBF3E8; --pink:#F18DA0; --pink2:#E86A83; --magenta:#D64A6E;
  --purple:#9B7BD4; --terracota:#D97550; --brown:#5C4632; --grey:#7A6A5A;
  --border:#F3DFE0; --serif:'Playfair Display',serif; --sans:'Poppins',sans-serif;
  --shadow:0 6px 22px rgba(180,140,150,.16);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--brown);line-height:1.5;
  background-image:radial-gradient(circle at 0% 0%,rgba(241,139,160,.06),transparent 40%),
  radial-gradient(circle at 100% 100%,rgba(124,123,216,.06),transparent 40%);}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}
h1,h2,h3{font-family:var(--serif);color:var(--brown)}
.container{width:min(1000px,94%);margin:0 auto}
.hidden{display:none!important}
.topbar{background:var(--purple);color:#fff;font-size:.78rem;padding:.45rem 0;text-align:center}
.header{background:rgba(251,246,239,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
.header .container{display:flex;align-items:center;justify-content:space-between;padding:.6rem 0}
.back-btn{display:inline-flex;align-items:center;gap:.4rem;background:linear-gradient(135deg,var(--pink),var(--magenta));color:#fff;
  border-radius:999px;padding:.45rem 1rem;font-size:.85rem;font-weight:600;box-shadow:var(--shadow);transition:transform .2s}
.back-btn:hover{transform:scale(1.04)}
.brand{font-family:var(--serif);font-size:1.1rem;font-weight:800;
  background:linear-gradient(90deg,#c9a24a,#e86a83);-webkit-background-clip:text;background-clip:text;color:transparent}
.header-links{display:flex;gap:1rem;align-items:center;font-size:.8rem;font-weight:500}
.lang-btn{background:linear-gradient(135deg,var(--pink),var(--magenta));color:#fff;border:none;border-radius:999px;padding:.3rem .8rem;font-size:.72rem;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:var(--shadow);transition:transform .2s}
.lang-btn:hover{transform:scale(1.06)}
.hero{margin-top:1.6rem;text-align:center}
.hero .badge{display:inline-block;background:var(--cream);color:var(--magenta);border:1px solid var(--border);padding:.3rem 1rem;border-radius:999px;font-size:.75rem;margin-bottom:.7rem}
.hero h1{font-size:clamp(1.4rem,4vw,2rem)}
.hero p{color:var(--grey);font-size:.9rem;margin-top:.3rem}
.searchbox{max-width:520px;margin:1.2rem auto 0;display:flex;gap:.5rem}
.searchbox input{flex:1;border:1px solid var(--border);border-radius:999px;padding:.7rem 1rem;font-family:inherit;background:#fff}
.searchbox button{background:linear-gradient(135deg,var(--pink),var(--magenta));color:#fff;border-radius:999px;padding:.7rem 1.2rem;font-weight:600}
.sec-head{margin:1.8rem 0 1rem}
.sec-head h2{font-size:1.2rem}
#gridCount{color:var(--grey);font-size:.85rem;margin-top:.2rem}
.products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:1rem}
.product{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.product .img{position:relative;height:160px;background:var(--bg2)}
.product .img img{width:100%;height:100%;object-fit:contain;padding:.5rem}
.product .badge{position:absolute;top:.4rem;left:.4rem;background:var(--magenta);color:#fff;font-size:.62rem;padding:.2rem .55rem;border-radius:999px}
.product .inf{padding:.8rem;display:flex;flex-direction:column;gap:.4rem;flex:1}
.product .nm{font-size:.82rem;font-weight:600;color:var(--brown);line-height:1.3;min-height:2.6rem}
.pr{color:var(--magenta);font-weight:700;font-size:1.05rem}
.pr .antes{color:var(--grey);text-decoration:line-through;font-size:.75rem;font-weight:400;margin-left:.35rem}
.pr .dcto{color:var(--terracota);font-size:.72rem;font-weight:600;margin-left:.35rem}
.product .buy{margin-top:auto;text-align:center;background:linear-gradient(135deg,var(--pink),var(--magenta));color:#fff;
  padding:.5rem;border-radius:999px;font-size:.8rem;font-weight:600}
.empty{background:var(--cream);border:1px dashed var(--border);border-radius:16px;text-align:center;padding:2rem 1rem;color:var(--grey)}
.footer{margin-top:2.5rem;padding:1.2rem 0;border-top:1px solid var(--border);text-align:center;font-size:.75rem;color:var(--grey)}
.footer .lnk{display:flex;justify-content:center;gap:1rem;margin:.5rem 0}
.disc{max-width:700px;margin:.5rem auto;font-size:.68rem;color:var(--grey)}
.cpy{font-size:.75rem;color:var(--grey)}
</style>
</head>
<body>

<div class="topbar" id="topbar">🔥 OFF en Amazon</div>

<header class="header">
  <div class="container">
    <a href="index.html" class="back-btn"><span>←</span><span id="backTxt">Volver a Inicio</span></a>
    <div class="header-links">
      <span class="brand">Mis Favoritos <span id="brX">de Amazon</span></span>
      <button id="langToggle" class="lang-btn" type="button">English</button>
    </div>
  </div>
</header>

<section class="hero container">
  <span class="badge" id="heroBadge">✦ RESULTADOS ✦</span>
  <h1 id="resTitle">Resultados de Búsqueda</h1>
  <p id="gridCount"></p>
  <div class="searchbox">
    <input type="search" id="searchInput" placeholder="🔍 ¿Qué estás buscando?">
    <button id="btnSearch">Buscar</button>
  </div>
</section>

<section class="container">
  <div class="products-grid" id="productsGrid"></div>
  <div class="empty hidden" id="emptyState"></div>
</section>

<footer class="footer">
  <div class="lnk"><a href="index.html" id="footHome">Inicio</a><a href="index.html#categorias" id="footCats">Categorías</a><a href="index.html#populares" id="footOffs">Ofertas</a></div>
  <p class="disc" id="footDisc">Divulgación de afiliados: Como Asociado de Amazon, este sitio genera comisiones por compras calificadas.</p>
  <div class="cpy">© <span id="year"></span> <span id="cpyName">Mis Favoritos de Amazon</span></div>
</footer>

<script>
const SUPABASE_URL='https://vmchbmrcpcpkycnadrzo.supabase.co';
const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZtY2hibXJjcGNwa3ljbmFkcnpvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5Njk3NDksImV4cCI6MjEwMTU0NTc0OX0.txUm9JTN8Ny1lCiFcOx80z_SrpMteWkLQSMoGlWKfH0';
let prods=[],lang=(localStorage.getItem('lang')||'es'),q='';

const I18N={
 es:{topbar:'🔥 OFF en Amazon',backTxt:'Volver a Inicio',brX:'de Amazon',heroBadge:'✦ RESULTADOS ✦',resTitle:'Resultados de Búsqueda',ph_:'🔍 ¿Qué estás buscando?',btnSearch:'Buscar',noRes:'No encontramos productos con esa búsqueda.',grid_n:'{n} productos',ver_en:'Ver en Amazon →',disc:'Divulgación de afiliados: Como Asociado de Amazon, este sitio genera comisiones por compras calificadas. ⚠️ Los precios y la disponibilidad pueden cambiar en cualquier momento: el precio aquí es orientativo y el final exacto lo confirma Amazon al añadir al carrito.',cpyName:'Mis Favoritos de Amazon',footHome:'Inicio',footCats:'Categorías',footOffs:'Ofertas',catErr:'Error al leer Supabase: ',nom:'Mis Favoritos'},
 en:{topbar:'🔥 Deals on Amazon',backTxt:'Back to Home',brX:'My Amazon Favorites',heroBadge:'✦ RESULTS ✦',resTitle:'Search Results',ph_:'🔍 What are you looking for?',btnSearch:'Search',noRes:'We found no products for that search.',grid_n:'{n} products',ver_en:'View on Amazon →',disc:'Affiliate disclosure: As an Amazon Associate, this site earns from qualifying purchases. ⚠️ Prices and availability may change at any time: the price here is indicative and the exact final price is always confirmed by Amazon when you add the item to your cart.',cpyName:'My Amazon Favorites',footHome:'Home',footCats:'Categories',footOffs:'Deals',catErr:'Error reading Supabase: ',nom:'My Favorites'}
};
const t=k=>{const d=I18N[lang]||{};return (k in d)?d[k]:k;};
function applyLang(){
  document.getElementById('topbar').textContent=t('topbar');
  document.getElementById('backTxt').textContent=t('backTxt');
  document.getElementById('brX').textContent=lang==='es'?'de Amazon':'My Amazon Favorites';
  document.getElementById('heroBadge').textContent=t('heroBadge');
  document.getElementById('resTitle').textContent=t('resTitle');
  document.getElementById('footDisc').textContent=t('disc');
  document.getElementById('cpyName').textContent=t('cpyName');
  document.getElementById('footHome').textContent=t('footHome');
  document.getElementById('footCats').textContent=t('footCats');
  document.getElementById('footOffs').textContent=t('footOffs');
  document.title=t('nom');
  var lt=document.getElementById('langToggle');if(lt)lt.textContent=lang==='es'?'English':'Spanish';
  var si=document.getElementById('searchInput');if(si)si.setAttribute('placeholder',t('ph_'));
  var bs=document.getElementById('btnSearch');if(bs)bs.textContent=t('btnSearch');
  renderGrid();
}
const $=(s,c=document)=>c.querySelector(s);
const $$=(s,c=document)=>[...c.querySelectorAll(s)];
const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmt=n=>'$'+Number(n||0).toLocaleString('en-US',{maximumFractionDigits:0});
const imgFallback=text=>`https://placehold.co/400x400/F5EDE2/D64A6E?text=${encodeURIComponent(text)}`;
const imgOf=p=>p&&p.imagen_url&&p.imagen_url.trim()?p.imagen_url:'';

function api(table,q){
  const url=SUPABASE_URL+'/rest/v1/'+table+(q||'');
  return fetch(url,{headers:{'apikey':SUPABASE_ANON,'Authorization':'Bearer '+SUPABASE_ANON}})
    .then(async r=>{const j=await r.json().catch(()=>null);if(!r.ok)throw new Error((j&&j.message)||('HTTP '+r.status));return j;});
}
function normProd(o){return {producto_id:+o.producto_id,subcat_slug:o.subcat_slug,nombre:o.nombre,precio:Number(o.precio)||0,precio_antes:Number(o.precio_antes)||0,imagen_url:o.imagen_url||'',link_amazon:o.link_amazon||'',carrusel_tipo:o.carrusel_tipo||''};}

async function cargar(){
  try{
    const p=await api('productos','?select=*&order=producto_id.asc');
    prods=(p||[]).map(normProd);
    q=(new URLSearchParams(location.search).get('q')||'').trim();
    var si=$('#searchInput');if(si)si.value=q;
    applyLang();
  }catch(e){var es=$('#emptyState');if(es){es.classList.remove('hidden');es.textContent=t('catErr')+e.message;}}
}

function productHTML(p){
  const img=imgOf(p)||imgFallback(p.nombre||'Producto');
  const antes=Number(p.precio_antes)||0,ahora=Number(p.precio)||0;
  const dcto=antes>ahora?Math.round((1-ahora/antes)*100):0;
  const price=dcto?`<span class="pr">${fmt(ahora)}<span class="antes">${fmt(antes)}</span><span class="dcto">-${dcto}%</span></span>`:`<span class="pr">${fmt(ahora)}</span>`;
  return `<article class="product"><div class="img"><img loading="lazy" src="${esc(img)}" alt="${esc(p.nombre)}" onerror="this.src='${imgFallback(p.nombre||'P')}'"></div><div class="inf"><div class="nm">${esc(p.nombre)}</div>${price}<a class="buy" href="${esc(p.link_amazon||'#')}" target="_blank" rel="noopener noreferrer sponsored">${t('ver_en')}</a></div></article>`;
}

function renderGrid(){
  const grid=$('#productsGrid'),emp=$('#emptyState'),cnt=$('#gridCount');if(!grid)return;
  const term=q.toLowerCase();
  const items=prods.filter(p=>!term||p.nombre.toLowerCase().includes(term));
  if(!items.length){grid.innerHTML='';emp.classList.remove('hidden');emp.textContent=t('noRes');cnt.textContent='';return;}
  emp.classList.add('hidden');grid.innerHTML=items.map(productHTML).join('');
  cnt.textContent=t('grid_n').replace('{n}',items.length);
}

function buscar(){
  var si=$('#searchInput');q=(si?si.value:'').trim();
  // actualiza la URL para que se pueda compartir/recargar
  history.replaceState(null,'',location.pathname+(q?'?q='+encodeURIComponent(q):''));
  renderGrid();
}

$('#btnSearch').addEventListener('click',buscar);
$('#searchInput').addEventListener('keydown',e=>{if(e.key==='Enter')buscar();});
$('#langToggle').addEventListener('click',()=>{lang=lang==='es'?'en':'es';localStorage.setItem('lang',lang);applyLang();});
$('#year').textContent=new Date().getFullYear();
cargar();
</script>
</body>
</html>
